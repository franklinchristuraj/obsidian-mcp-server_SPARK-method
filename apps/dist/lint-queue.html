<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lint Queue</title>
<style>
:root {
  --fa-teal: #0E7C86;
  --fa-teal-40: #6EB0B6;
  --fa-teal-20: #B7DBDE;
  --fa-coral: #C24A22;
  --fa-coral-40: #DD8E74;
  --fa-coral-20: #EFCBBD;
  --fa-sand: #FBF8F5;
  --fa-white: #FFFFFF;
  --fa-amber: #D98A15;
  --fa-ink: #04211B;
  --fa-black: #1C1B19;
  --fa-stone: #5F5E5A;
  --fa-font: Inter, "Space Grotesk", system-ui, -apple-system, sans-serif;
  --fa-radius: 6px;
  --fa-gap: 12px;
  --fa-surface: var(--fa-sand);
  --fa-text: var(--fa-black);
  --fa-muted: var(--fa-stone);
}

@media (prefers-color-scheme: dark) {
  :root {
    --fa-surface: var(--fa-ink);
    --fa-text: var(--fa-white);
    --fa-muted: #9C9A92;
  }
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--fa-font);
  background: var(--fa-surface);
  color: var(--fa-text);
  font-size: 14px;
  line-height: 1.45;
}
.app {
  padding: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  max-width: 700px;
  margin: 0 auto;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fa-teal);
  font-weight: 600;
}
h1 {
  margin: 4px 0 6px;
  font-size: 22px;
  letter-spacing: -0.02em;
  font-weight: 700;
}
.muted { color: var(--fa-muted); }
.amber { color: var(--fa-amber); }
.coral { color: var(--fa-coral); }
.panel {
  background: var(--fa-surface);
  border: 1px solid var(--fa-teal-20);
  border-radius: var(--fa-radius);
  padding: 12px;
  margin-top: 12px;
}
.section-title {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fa-teal);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}
.row { margin: 6px 0; }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}
button {
  font-family: inherit;
  font-size: 14px;
  border-radius: var(--fa-radius);
  padding: 10px 14px;
  min-height: 44px;
  cursor: pointer;
  border: 1px solid transparent;
}
button.primary {
  background: var(--fa-coral);
  color: var(--fa-white);
  border-color: var(--fa-coral);
}
button.primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
button.ghost {
  background: transparent;
  color: var(--fa-text);
  border-color: var(--fa-teal-40);
}
.skel {
  height: 14px;
  background: var(--fa-teal-20);
  border-radius: 4px;
  margin: 8px 0;
  opacity: 0.5;
}
.gap-item::before { content: "⚠ "; color: var(--fa-amber); }
.mono { font-family: ui-monospace, monospace; font-size: 12px; }
.strike { text-decoration: line-through; color: var(--fa-stone); }
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}
.dot.fresh { background: var(--fa-teal); }
.dot.aging { background: var(--fa-amber); }
.dot.stale { background: var(--fa-amber); }
.error {
  border: 1px solid var(--fa-coral);
  padding: 12px;
  border-radius: var(--fa-radius);
  color: var(--fa-text);
}
.empty { color: var(--fa-muted); padding: 16px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--fa-teal-20); }
th { color: var(--fa-teal); font-size: 11px; letter-spacing: 0.06em; }
.amber-rule { border-left: 3px solid var(--fa-amber); padding-left: 8px; }


</style>
</head>
<body>
<div class="app" id="root"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<!-- shell:bridge:start -->
<script>
/**
 * Minimal MCP Apps host bridge (postMessage JSON-RPC, SEP-1865).
 * No network, no CDN.
 *
 * Lifecycle: ui/initialize -> ui/notifications/initialized -> host sends
 * ui/notifications/tool-input then ui/notifications/tool-result. The host is
 * forbidden from sending anything before `initialized`, so the notification is
 * mandatory, not optional.
 */
(function (global) {
  var PROTOCOL_VERSION = "2026-01-26";
  var DEFAULT_TIMEOUT_MS = 15000;
  var TOOL_CALL_TIMEOUT_MS = 60000;
  var NO_RESULT_AFTER_MS = 20000;

  function ZiksakaBridge(appName) {
    this.appName = appName;
    this._id = 1;
    this._pending = new Map();
    this._onResult = null;
    this._onError = null;
    this._onInput = null;
    this._onHostContext = null;
    this._gotResult = false;
    this._noResultTimer = null;
    this._sizeTimer = null;
    this._lastSize = "";
    this.hostContext = {};
    this.hostCapabilities = {};
    this.toolInput = null;
    this.autoDiagnostics = true;
    var self = this;
    window.addEventListener("message", function (ev) {
      self._onMessage(ev);
    });
  }

  ZiksakaBridge.prototype.connect = function () {
    var self = this;
    return this._request("ui/initialize", {
      protocolVersion: PROTOCOL_VERSION,
      appInfo: { name: this.appName, version: "1.0.0" },
      appCapabilities: {
        availableDisplayModes: ["inline", "fullscreen"],
      },
    }).then(function (result) {
      self.hostContext = (result && result.hostContext) || {};
      self.hostCapabilities = (result && result.capabilities) || {};
      self._applyHostStyles();
      // The host will not send tool-input/tool-result until it sees this.
      self._notify("ui/notifications/initialized", {});
      self._watchSize();
      self._armNoResultDiagnostic();
      return result;
    });
  };

  ZiksakaBridge.prototype.onToolResult = function (fn) {
    this._onResult = fn;
  };

  ZiksakaBridge.prototype.onToolError = function (fn) {
    this._onError = fn;
  };

  ZiksakaBridge.prototype.onToolInput = function (fn) {
    this._onInput = fn;
    if (this.toolInput) fn(this.toolInput);
  };

  ZiksakaBridge.prototype.onHostContextChanged = function (fn) {
    this._onHostContext = fn;
  };

  ZiksakaBridge.prototype.callServerTool = function (name, args) {
    return this._request(
      "tools/call",
      { name: name, arguments: args || {} },
      TOOL_CALL_TIMEOUT_MS
    );
  };

  ZiksakaBridge.prototype.readResource = function (uri) {
    return this._request("resources/read", { uri: uri });
  };

  ZiksakaBridge.prototype.sendFollowup = function (text) {
    return this._request("ui/message", {
      role: "user",
      content: { type: "text", text: String(text) },
    });
  };

  ZiksakaBridge.prototype.updateModelContext = function (structuredContent) {
    return this._request("ui/update-model-context", {
      structuredContent: structuredContent || {},
    });
  };

  ZiksakaBridge.prototype.openLink = function (url) {
    return this._request("ui/open-link", { url: url });
  };

  ZiksakaBridge.prototype.requestFullscreen = function () {
    var modes = this.hostContext.availableDisplayModes;
    if (modes && modes.indexOf("fullscreen") === -1) {
      return Promise.resolve({ mode: this.hostContext.displayMode || "inline" });
    }
    return this._request("ui/request-display-mode", { mode: "fullscreen" }).catch(
      function () {
        return null;
      }
    );
  };

  ZiksakaBridge.prototype.log = function (level, data) {
    this._notify("notifications/message", {
      level: level || "info",
      logger: this.appName,
      data: data,
    });
  };

  /** Report body size so the host can size the iframe. */
  ZiksakaBridge.prototype.reportSize = function () {
    var body = document.body;
    if (!body) return;
    var height = Math.ceil(
      Math.max(
        body.scrollHeight,
        body.offsetHeight,
        document.documentElement ? document.documentElement.scrollHeight : 0
      )
    );
    var width = Math.ceil(body.scrollWidth || body.offsetWidth || 0);
    if (!height) return;
    var key = width + "x" + height;
    if (key === this._lastSize) return;
    this._lastSize = key;
    this._notify("ui/notifications/size-changed", {
      width: width,
      height: height,
    });
  };

  ZiksakaBridge.prototype._watchSize = function () {
    var self = this;
    var schedule = function () {
      if (self._sizeTimer) return;
      self._sizeTimer = setTimeout(function () {
        self._sizeTimer = null;
        self.reportSize();
      }, 50);
    };
    schedule();
    if (global.ResizeObserver && document.body) {
      try {
        new ResizeObserver(schedule).observe(document.body);
      } catch (e) {
        /* ignore */
      }
    }
    window.addEventListener("load", schedule);
  };

  /** Apply host-provided theme variables for visual cohesion. */
  ZiksakaBridge.prototype._applyHostStyles = function () {
    var styles = this.hostContext.styles || {};
    var vars = styles.variables || {};
    var rootEl = document.documentElement;
    Object.keys(vars).forEach(function (key) {
      var value = vars[key];
      if (typeof value === "string" && value) rootEl.style.setProperty(key, value);
    });
    if (this.hostContext.theme) {
      rootEl.style.colorScheme = this.hostContext.theme;
      rootEl.setAttribute("data-theme", this.hostContext.theme);
    }
  };

  /**
   * A blank surface is the worst failure mode: if the host never delivers a
   * result, say so instead of leaving the skeleton up forever.
   */
  ZiksakaBridge.prototype._armNoResultDiagnostic = function () {
    var self = this;
    this._noResultTimer = setTimeout(function () {
      if (self._gotResult) return;
      var err = new Error(
        "No tool result received from the host after " +
          Math.round(NO_RESULT_AFTER_MS / 1000) +
          "s."
      );
      if (self._onError) {
        self._onError(err);
      } else if (self.autoDiagnostics) {
        self._renderDiagnostic(err.message);
      }
    }, NO_RESULT_AFTER_MS);
  };

  ZiksakaBridge.prototype._renderDiagnostic = function (message) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML =
      '<div class="error"><strong>' +
      this.appName +
      "</strong><br/>" +
      String(message).replace(/[<>&]/g, "") +
      "</div>";
    this.reportSize();
  };

  ZiksakaBridge.prototype._request = function (method, params, timeoutMs) {
    var id = this._id++;
    var self = this;
    return new Promise(function (resolve, reject) {
      self._pending.set(id, { resolve: resolve, reject: reject });
      self._post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
      setTimeout(function () {
        if (self._pending.has(id)) {
          self._pending.delete(id);
          reject(new Error("timeout waiting for host: " + method));
        }
      }, timeoutMs || DEFAULT_TIMEOUT_MS);
    });
  };

  ZiksakaBridge.prototype._notify = function (method, params) {
    this._post({ jsonrpc: "2.0", method: method, params: params || {} });
  };

  ZiksakaBridge.prototype._respond = function (id, result) {
    this._post({ jsonrpc: "2.0", id: id, result: result || {} });
  };

  ZiksakaBridge.prototype._post = function (msg) {
    (window.parent || window).postMessage(msg, "*");
  };

  ZiksakaBridge.prototype._onMessage = function (ev) {
    var data = ev.data;
    if (!data || data.jsonrpc !== "2.0") return;

    // Response to one of our requests.
    if (data.method === undefined && data.id != null) {
      var p = this._pending.get(data.id);
      if (!p) return;
      this._pending.delete(data.id);
      if (data.error) p.reject(new Error(data.error.message || "host error"));
      else p.resolve(data.result);
      return;
    }

    // Request from the host: it blocks until we answer.
    if (data.id != null && data.method) {
      if (data.method === "ping" || data.method === "ui/resource-teardown") {
        this._respond(data.id, {});
      } else {
        this._post({
          jsonrpc: "2.0",
          id: data.id,
          error: { code: -32601, message: "Method not found: " + data.method },
        });
      }
      return;
    }

    switch (data.method) {
      case "ui/notifications/tool-input":
      case "ui/notifications/tool-input-partial":
        this.toolInput = (data.params && data.params.arguments) || {};
        if (this._onInput) this._onInput(this.toolInput);
        break;
      case "ui/notifications/tool-result":
        this._gotResult = true;
        clearTimeout(this._noResultTimer);
        if (this._onResult) this._onResult(data.params, data.params);
        this.reportSize();
        break;
      case "ui/notifications/tool-cancelled":
        this._gotResult = true;
        clearTimeout(this._noResultTimer);
        var reason = (data.params && data.params.reason) || "Tool call cancelled.";
        if (this._onError) this._onError(new Error(reason));
        else if (this.autoDiagnostics) this._renderDiagnostic(reason);
        break;
      case "ui/notifications/host-context-changed":
        this.hostContext = Object.assign({}, this.hostContext, data.params || {});
        this._applyHostStyles();
        if (this._onHostContext) this._onHostContext(this.hostContext);
        break;
      default:
        break;
    }
  };

  /** Extract structured payload from a CallToolResult. */
  ZiksakaBridge.structured = function (result) {
    if (!result) return null;
    if (result.structuredContent) return result.structuredContent;
    if (result.metadata) return result.metadata;
    if (result.content && result.content[0] && result.content[0].text) {
      try {
        return JSON.parse(result.content[0].text);
      } catch (e) {
        return { text: result.content[0].text };
      }
    }
    return result;
  };

  global.ZiksakaBridge = ZiksakaBridge;
})(window);
</script>
<!-- shell:bridge:end -->
<script>

const root = document.getElementById("root");
const bridge = new ZiksakaBridge("lint-queue");
let selected = new Set();
let state = null;
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

function render(data) {
  state = data;
  selected = new Set();
  const h = data.health || {};
  const findings = data.findings || [];
  const byCat = {};
  findings.forEach(f => { (byCat[f.category] = byCat[f.category] || []).push(f); });
  const order = ["broken_link","alias_collision","orphan_entity","missing_frontmatter","missing_connections","naming_drift"];
  let html = `<div class="eyebrow">${esc((data.scope||"").toUpperCase())} · LINT</div>
    <h1>Lint queue</h1>
    <div class="panel" style="display:flex;flex-wrap:wrap;gap:12px;color:var(--fa-teal)">
      <span>notes ${h.notes??"·"}</span><span>entities ${h.entities??"·"}</span>
      <span>edges ${h.edges??"·"}</span><span>orphans ${h.orphan_entities??"·"}</span>
      <span>broken ${h.broken_links??"·"}</span><span>aliases ${h.alias_collisions??"·"}</span>
    </div>`;
  order.forEach(cat => {
    const list = byCat[cat] || [];
    if (!list.length) return;
    const open = list.some(f => f.severity === "high");
    html += `<details class="panel" ${open?"open":""}><summary class="section-title">${esc(cat)} <span>${list.length}</span></summary>`;
    list.forEach(f => {
      html += `<div class="row" style="display:flex;gap:8px;align-items:flex-start">`;
      if (f.auto_fixable) {
        html += `<input type="checkbox" data-id="${esc(f.id)}" style="margin-top:4px;width:18px;height:18px"/>`;
      } else {
        html += `<span class="amber" title="not auto-fixable">●</span>`;
      }
      html += `<div><div class="mono">${esc(f.note_path)}</div><div>${esc(f.detail)}</div>`;
      if (f.proposed_fix) {
        html += `<div class="mono strike">${esc(f.proposed_fix.before)}</div>
                 <div class="mono">${esc(f.proposed_fix.after)}</div>`;
      }
      html += `</div></div>`;
    });
    html += `</details>`;
  });
  if (!findings.length) html += `<div class="empty">No findings — vault looks clean.</div>`;
  html += `<div class="actions"><span class="muted" id="sel-count">0 selected</span>
    <button class="primary" id="btn-apply" disabled>Apply selected fixes</button></div>
    <div id="preview"></div>`;
  root.innerHTML = html;
  root.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id);
      document.getElementById("sel-count").textContent = selected.size + " selected";
      document.getElementById("btn-apply").disabled = selected.size === 0;
    };
  });
  document.getElementById("btn-apply").onclick = async () => {
    const ids = [...selected];
    const preview = document.getElementById("preview");
    preview.innerHTML = `<div class="panel">Applying ${ids.length} fixes… confirm already given by click.</div>`;
    try {
      await bridge.callServerTool("lint_apply", { scope: data.scope, finding_ids: ids });
      const fresh = await bridge.callServerTool("lint_queue", { scope: data.scope });
      render(ZiksakaBridge.structured(fresh));
    } catch (err) {
      preview.innerHTML = `<div class="error">lint_apply<br/>${esc(err.message)}</div>`;
    }
  };
}
bridge.onToolResult((data) => render(ZiksakaBridge.structured(data) || data));
bridge.connect().catch((e) => { root.innerHTML = `<div class="error"><strong>lint_queue</strong><br/>${esc(e.message)}</div>`; });

</script>
</body>
</html>
