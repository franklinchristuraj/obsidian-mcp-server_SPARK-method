# Updated Nginx configuration for Claude Desktop MCP connection
# Add this to your Nginx Proxy Manager advanced configuration
#
# No sticky sessions required (MCP 2026-07-28 dual-compat is stateless).
# Prefer 60s timeouts once clients use Tasks for heavy tools; keep 3600s
# only for legacy sync heavy tools or GET /mcp keepalive.

# Handle CORS preflight requests
location /mcp {
    # Handle OPTIONS requests for CORS preflight
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Mcp-Session-Id, Mcp-Protocol-Version, Mcp-Method, Mcp-Name' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Content-Type' 'text/plain charset=UTF-8' always;
        add_header 'Content-Length' 0 always;
        return 204;
    }

    # Proxy to MCP server
    proxy_pass http://172.20.0.1:8888;
    proxy_http_version 1.1;

    # Inject API key for upstream auth
    # Set MCP_API_KEY environment variable or replace with your key
    proxy_set_header Authorization "Bearer ${MCP_API_KEY}";

    # Preserve host and client info
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass through MCP routing headers (SEP-2243) for logging / future ACLs
    proxy_set_header Mcp-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header Mcp-Method $http_mcp_method;
    proxy_set_header Mcp-Name $http_mcp_name;
    proxy_set_header Mcp-Session-Id $http_mcp_session_id;

    # CORS headers for actual requests
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Mcp-Session-Id, Mcp-Protocol-Version, Mcp-Method, Mcp-Name' always;

    # SSE friendliness (legacy GET /mcp keepalive)
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    # 60s is enough for Task-aware clients; raise if legacy sync lint/build_context remains common
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    add_header X-Accel-Buffering no;

    # Optional: further lock down access (replace with Claude IPs/CIDRs)
    # allow 203.0.113.0/24;
    # deny all;
}
