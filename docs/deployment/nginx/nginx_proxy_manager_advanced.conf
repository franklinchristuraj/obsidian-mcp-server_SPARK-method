# Nginx Proxy Manager Advanced Configuration
# Copy this entire configuration into the "Advanced" tab of your Proxy Host
#
# MCP 2026-07-28 dual-compat: forward Mcp-* headers; no sticky sessions.
# Keep 3600s timeouts until Task-aware clients are confirmed for heavy tools.

# More specific than default location / — takes precedence for /mcp
location /mcp {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Mcp-Session-Id, Mcp-Protocol-Version, Mcp-Method, Mcp-Name' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Content-Type' 'text/plain charset=UTF-8' always;
        add_header 'Content-Length' 0 always;
        return 204;
    }

    # IMPORTANT: If Nginx Proxy Manager is in Docker, use Docker gateway IP
    # Current prod forward: 172.17.0.1:8888
    proxy_pass http://172.17.0.1:8888;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Pass through MCP routing headers (SEP-2243)
    proxy_set_header Mcp-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header Mcp-Method $http_mcp_method;
    proxy_set_header Mcp-Name $http_mcp_name;
    proxy_set_header Mcp-Session-Id $http_mcp_session_id;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Mcp-Session-Id, Mcp-Protocol-Version, Mcp-Method, Mcp-Name' always;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    # Keep long timeouts for legacy sync heavy tools (lint_vault, build_context)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    add_header X-Accel-Buffering no;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
