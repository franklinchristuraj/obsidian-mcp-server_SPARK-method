# Host nginx: forward HTTP for NPM-managed domains to Nginx Proxy Manager.
# NPM is published on host port 8085 (container port 80) to avoid conflicting with this nginx on :80.
#
# Install (requires sudo):
#   sudo cp docs/deployment/nginx/mcp.ziksaka.com.host-nginx.conf /etc/nginx/sites-available/npm-http-proxy.conf
#   sudo ln -sf /etc/nginx/sites-available/npm-http-proxy.conf /etc/nginx/sites-enabled/npm-http-proxy.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# After NPM is running on 443, HTTPS for mcp.ziksaka.com is terminated by NPM.

# MCP + other NPM hosts: HTTP (ACME challenges + redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name mcp.ziksaka.com ntfy-fc.ziksaka.com weaviate.ziksaka.com phoenix.ziksaka.com
                api.ziksaka.com coach-api.ziksaka.com meridian.ziksaka.com;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
